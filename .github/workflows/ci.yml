name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backend tests (node:test)
        run: npm run test:api

      - name: Frontend tests (Jest)
        run: npm test
        env:
          CI: true

      - name: Production build (also lints)
        run: npm run build
        env:
          CI: true
