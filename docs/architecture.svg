<svg width="100%" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, system-ui, Segoe UI, Roboto, sans-serif" role="img" aria-label="arXiv Explorer architecture">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="360" fill="#ffffff"/>

  <!-- legend -->
  <rect x="40" y="18" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#888780"/>
  <text x="60" y="29" font-size="12" fill="#5F5E5A">existing</text>
  <rect x="150" y="18" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="170" y="29" font-size="12" fill="#3C3489">your backend</text>
  <rect x="320" y="18" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="340" y="29" font-size="12" fill="#085041">managed infra</text>

  <!-- row A: client -> gateway -> external -->
  <rect x="40" y="55" width="170" height="46" rx="4" fill="#F1EFE8" stroke="#888780"/>
  <text x="125" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Frontend</text>
  <text x="125" y="92" text-anchor="middle" font-size="12" fill="#5F5E5A">React SPA on Vercel</text>

  <rect x="270" y="55" width="190" height="46" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="365" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Backend API</text>
  <text x="365" y="92" text-anchor="middle" font-size="12" fill="#534AB7">Vercel functions</text>

  <rect x="520" y="55" width="120" height="46" rx="4" fill="#F1EFE8" stroke="#888780"/>
  <text x="580" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">arXiv API</text>
  <text x="580" y="92" text-anchor="middle" font-size="12" fill="#5F5E5A">external</text>

  <line x1="210" y1="78" x2="266" y2="78" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="460" y1="78" x2="518" y2="78" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="365" y1="101" x2="365" y2="122" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- concerns -->
  <rect x="60" y="124" width="560" height="58" rx="6" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="72" y="119" font-size="12" fill="#5F5E5A">what the backend does</text>
  <g font-size="14" font-weight="600">
    <rect x="70" y="130" width="120" height="42" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="130" y="148" text-anchor="middle" fill="#3C3489">Auth</text>
    <text x="130" y="163" text-anchor="middle" font-size="12" font-weight="400" fill="#534AB7">JWT cookie</text>
    <rect x="210" y="130" width="120" height="42" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="270" y="148" text-anchor="middle" fill="#3C3489">Rate limit</text>
    <text x="270" y="163" text-anchor="middle" font-size="12" font-weight="400" fill="#534AB7">token bucket</text>
    <rect x="350" y="130" width="120" height="42" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="410" y="148" text-anchor="middle" fill="#3C3489">Cache-aside</text>
    <text x="410" y="163" text-anchor="middle" font-size="12" font-weight="400" fill="#534AB7">TTL + SWR</text>
    <rect x="490" y="130" width="120" height="42" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="550" y="148" text-anchor="middle" fill="#3C3489">Resilience</text>
    <text x="550" y="163" text-anchor="middle" font-size="12" font-weight="400" fill="#534AB7">retry/breaker</text>
  </g>

  <line x1="220" y1="183" x2="220" y2="204" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="460" y1="183" x2="460" y2="204" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- data stores -->
  <rect x="120" y="205" width="200" height="46" rx="4" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="220" y="226" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Upstash Redis</text>
  <text x="220" y="242" text-anchor="middle" font-size="12" fill="#0F6E56">cache + rate limit</text>

  <rect x="360" y="205" width="200" height="46" rx="4" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="460" y="226" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Neon Postgres</text>
  <text x="460" y="242" text-anchor="middle" font-size="12" fill="#0F6E56">users + bookmarks</text>

  <!-- ops band -->
  <rect x="40" y="282" width="600" height="58" rx="6" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="46" y="277" font-size="12" fill="#5F5E5A">ci/cd + observability</text>
  <g font-size="14" font-weight="600">
    <rect x="65" y="288" width="170" height="42" rx="4" fill="#F1EFE8" stroke="#888780"/>
    <text x="150" y="306" text-anchor="middle" fill="#2C2C2A">GitHub Actions</text>
    <text x="150" y="321" text-anchor="middle" font-size="12" font-weight="400" fill="#5F5E5A">lint · test · build</text>
    <rect x="255" y="288" width="170" height="42" rx="4" fill="#F1EFE8" stroke="#888780"/>
    <text x="340" y="306" text-anchor="middle" fill="#2C2C2A">/api/health</text>
    <text x="340" y="321" text-anchor="middle" font-size="12" font-weight="400" fill="#5F5E5A">readiness probe</text>
    <rect x="445" y="288" width="170" height="42" rx="4" fill="#F1EFE8" stroke="#888780"/>
    <text x="530" y="306" text-anchor="middle" fill="#2C2C2A">Structured logs</text>
    <text x="530" y="321" text-anchor="middle" font-size="12" font-weight="400" fill="#5F5E5A">JSON to stdout</text>
  </g>
</svg>
